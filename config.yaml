# Настройки блога и RSS-ленты для Дзена
# TODO-поля заполняются после того, как известны домен и канал.

site_url: "https://blog.example.ru"        # TODO: реальный поддомен блога, без слеша в конце
main_site_url: "https://example.ru"        # TODO: основной сайт FL Haus
dzen_channel_url: ""                       # TODO: ссылка на канал в Дзене

site_title: "FL Haus — журнал о загородной жизни"
site_description: "Как выбрать, построить и обжить загородный дом: цены, технологии, ипотека, опыт владельцев."
language: "ru"

# Режим публикации в Дзене:
#   draft   — статьи приходят в черновики канала, человек проверяет и публикует
#   publish — статьи публикуются сами в дату/время из поля date статьи
dzen_mode: "draft"

# Время выхода статьи по Москве (используется агентом при выборе даты)
publish_time: "10:00"
timezone: "+0300"

# Сколько последних статей держать в RSS-ленте
feed_items: 30

# Комментарии в Дзене: comment-all | comment-subscribers | comment-none
dzen_comments: "comment-all"

# Блок призыва в конце каждой статьи на сайте (в Дзен не уходит — там CTA пишется в тексте)
site_cta:
  title: "Подберём дом под ваш участок и бюджет"
  text: "Покажем дома вживую в шоурумах в Санкт-Петербурге и Москве, рассчитаем стоимость с доставкой и фундаментом."
  button: "Перейти на сайт FL Haus"
