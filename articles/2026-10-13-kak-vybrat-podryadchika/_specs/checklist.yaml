type: dzen-checklist
title: "Как проверить подрядчика за один вечер"
subtitle: "Пять минут на каждый пункт — до того, как отдать деньги"
groups:
  - q: "Документы?"
    items: ["Выписка ЕГРЮЛ: возраст компании, владелец, смена директора", "Арбитражные дела: иски от заказчиков", "Федресурс: нет ли сообщений о банкротстве"]
  - q: "Дома?"
    items: ["Адреса построенных домов, а не рендеры", "Контакты владельцев, готовых поговорить"]
  - q: "Деньги?"
    items: ["Оплата по этапам, без аванса в половину суммы", "Аккредитация в банке и работа через эскроу", "Типовой проект и фиксированная смета"]
source: "Сервисы ФНС, kad.arbitr.ru, fedresurs.ru · проверено 13.10.2026"
