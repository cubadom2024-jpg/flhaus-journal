type: dzen-flow
title: "Где ваши деньги, пока строится дом"
subtitle: "Схема оплаты через эскроу-счёт"
cards:
  - {title: "Вы", text: "подписываете договор подряда и кладёте деньги — свои или ипотечные — на эскроу-счёт"}
  - {title: "Банк", text: "держит деньги, пока компания строит дом. Подрядчик их не видит"}
  - {title: "Подрядчик", text: "получает оплату только после того, как дом готов и право собственности зарегистрировано"}
conclusion: "Если компания исчезнет на полпути, <b>деньги не уйдут на её долги</b>"
source: "Закон 186-ФЗ, действует с 1 марта 2025 года · проверено 13.10.2026"
