type: steps
kicker: "Эскроу при строительстве дома"
title: "Где ваши деньги, пока строится дом"
items:
  - "Вы подписываете договор подряда с компанией"
  - "Деньги — свои или ипотечные — ложатся на эскроу-счёт в банке"
  - "Компания строит дом, деньги лежат в банке"
  - "Дом готов, право собственности зарегистрировано"
  - "Только теперь банк перечисляет деньги подрядчику"
source: "Федеральный закон № 186-ФЗ, действует с 1 марта 2025 года"
